name: Publicar app (Expo Go)

# Publica la app con EAS Update para abrirla en Expo Go (iPhone y Android)
# sin pasar por un computador. Necesita el secret EXPO_TOKEN en el repo.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-app.yml']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: ¿Hay token de Expo?
        id: token
        working-directory: .
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; echo "Falta el secret EXPO_TOKEN: no se publica."; fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.hay == 'si'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.hay == 'si'
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.hay == 'si'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar
        if: steps.token.outputs.hay == 'si'
        run: npm install --no-audit --no-fund

      - name: Configurar EAS Update
        if: steps.token.outputs.hay == 'si'
        run: eas update:configure --platform all --non-interactive

      - name: Publicar
        if: steps.token.outputs.hay == 'si'
        env:
          MENSAJE: ${{ github.event.head_commit.message || 'Publicación manual' }}
        run: eas update --branch main --platform all --non-interactive --message "$(printf '%s' "$MENSAJE" | head -n 1)"
